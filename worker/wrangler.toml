# This name must match the Worker you connected to the repository, or Workers
# Builds fails the build with a "Failed to match Worker name" warning.
name = "boom"
main = "src/index.js"
compatibility_date = "2026-10-06"

# Set explicitly so the deploy does not warn about defaults.
workers_dev = true
preview_urls = true

# Where the uploaded GIFs live. R2 free tier: 10 GB, 1M writes and 10M reads a
# month, no egress fees — that is tens of thousands of 250 KB GIFs.
[[r2_buckets]]
binding = "GIFS"
bucket_name = "boom-gifs"

[vars]
# Left empty on purpose: anyone can upload, this is a public toy. Set it to a
# secret and the app sends it as "x-boom-key" if you ever want to lock uploads
# down. 10 GB of R2 is ~40,000 GIFs, so abuse costs little either way.
UPLOAD_KEY = ""

# Needed for /avatar/<discord id>.png. A bot token from
# https://discord.com/developers/applications -> your app -> Bot -> Reset Token.
# Set it as a secret instead of here:  npx wrangler secret put DISCORD_TOKEN
# DISCORD_TOKEN = ""

# Headless Chromium, used ONLY by /render and /render.gif (server-side renders
# for bots). It is commented out because provisioning it broke Workers Builds on
# this account; without it those two endpoints answer 501 and everything else
# works normally. To try it, uncomment these three lines and deploy:
#
# [browser]
# binding = "BROWSER"
#
# Free plan: 10 browser minutes a day, one new browser every 20s, 60s per session.
